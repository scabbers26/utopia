<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
   <link rel="stylesheet" href="cart.css">
</head>
<body>
    <div class="logo-container">
        <img src="https://shop.travisscott.com/cdn/shop/files/utopia.png?v=1688787549" alt="Logo" class="logo">
    </div>
    <div class="cart-container">
        <span class="cart-link">CART (0 ITEMS)</span>
    </div>

    <!-- Cart Sidebar -->
    <div id="cartSidebar" class="cart-sidebar">
        <div class="cart-sidebar-header">
            <h2>Cart</h2>
            <span id="cartSidebarClose" class="cart-sidebar-close">&times;</span>
        </div>
        <div class="cart-sidebar-content" id="cartItemsContainer"></div>
        <div class="subtotal-container">
            <span class="subtotal-text">Subtotal:</span>
            <span class="subtotal-amount">$0.00</span>
        </div>
       <div class="checkout-button-container">
    <a href="checkout.html" class="checkout-button">CHECKOUT</a>
</div>

        <div class="empty-cart-message">Your cart is empty</div>
    </div>

    <div class="product-container">
        <div class="product-image">
            <img src="https://shop.travisscott.com/cdn/shop/files/2c_PACKcd_1500x_d2cccb5a-3a8e-4145-a621-cdf54a83314f_1500x.jpg?v=1690398310" alt="UTOPIA CD COVER 2">
        </div>
        <div class="product-details">
            <h2 class="product-title">UTOPIA CD COVER 2</h2>
            <p class="product-description">LIMIT 4 PER CUSTOMER • SHIPS WITHIN 1 WEEK</p>
            <p class="product-price">$12</p>
            <form id="productForm" action="/cart/add" method="post" enctype="multipart/form-data">
                <input type="hidden" name="quantity" value="1">
                <input type="hidden" name="id" value="1">
                <button type="submit" name="add" class="K__button" aria-label="Buy: UTOPIA CD COVER 2">
                    BUY
                </button>
            </form>
        </div>

        </div>
    </div>
<script>document.addEventListener('DOMContentLoaded', function() {
    const cartLink = document.querySelector('.cart-link');
    const cartSidebar = document.getElementById('cartSidebar');
    const cartSidebarClose = document.getElementById('cartSidebarClose');
    const cartItemsContainer = document.getElementById('cartItemsContainer');
    const emptyCartMessage = document.querySelector('.empty-cart-message');
    const subtotalAmount = document.querySelector('.subtotal-amount');
    let cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];

    function updateCartSidebar() {
        cartItemsContainer.innerHTML = '';
        if (cartItems.length === 0) {
            cartItemsContainer.appendChild(emptyCartMessage);
            emptyCartMessage.style.display = 'block'; // Show empty cart message
            subtotalAmount.textContent = '$0.00'; // Reset subtotal to zero when cart is empty
        } else {
            emptyCartMessage.style.display = 'none'; // Hide empty cart message
            let subtotal = 0;
            cartItems.forEach((item, index) => {
                const cartItem = document.createElement('div');
                cartItem.classList.add('cart-item');
                cartItem.innerHTML = `
                    <img src="${item.image}" alt="${item.title}">
                    <div class="cart-item-details">
                        <span>${item.title}</span>
                        <span class="cart-item-quantity">Quantity: ${item.quantity}</span>
                        <span class="cart-item-price">$${(item.price * item.quantity).toFixed(2)}</span>
                    </div>
                    <span class="remove-cart-item" data-index="${index}">&times;</span>
                `;
                cartItemsContainer.appendChild(cartItem);

                subtotal += item.price * item.quantity; // Calculate subtotal
            });

            subtotalAmount.textContent = `$${subtotal.toFixed(2)}`;
        }

        updateCartLink(); // Update cart link display in sidebar
    }

    function updateCartLink() {
        const itemCount = cartItems.reduce((total, item) => total + item.quantity, 0);
        cartLink.textContent = `CART (${itemCount} ITEM${itemCount !== 1 ? 'S' : ''})`; // Corrected pluralization
    }

    function addItemToCart(item) {
        const existingItem = cartItems.find(cartItem => cartItem.title === item.title);
        if (existingItem) {
            existingItem.quantity++;
        } else {
            item.quantity = 1;
            cartItems.push(item);
        }
        localStorage.setItem('cartItems', JSON.stringify(cartItems));
        updateCartSidebar();
        updateCartLink();
    }

    function removeItemFromCart(index) {
        cartItems.splice(index, 1);
        localStorage.setItem('cartItems', JSON.stringify(cartItems));
        updateCartSidebar();
        updateCartLink();
    }

    document.getElementById('productForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const item = {
            title: 'UTOPIA CD COVER 2', // Replace with dynamic product title
            price: 12, // Replace with dynamic product price
            image: 'https://shop.travisscott.com/cdn/shop/files/2c_PACKcd_1500x_d2cccb5a-3a8e-4145-a621-cdf54a83314f_1500x.jpg?v=1690398310' // Replace with dynamic product image URL
        };
        addItemToCart(item);
    });

    cartLink.addEventListener('click', function() {
        cartSidebar.classList.add('active');
        updateCartSidebar(); // Update sidebar when opened
    });

    cartSidebarClose.addEventListener('click', function() {
        cartSidebar.classList.remove('active');
    });

    cartItemsContainer.addEventListener('click', function(e) {
        if (e.target.classList.contains('remove-cart-item')) {
            const index = parseInt(e.target.getAttribute('data-index'));
            removeItemFromCart(index);
        }
    });

    updateCartLink(); // Initial link update
});
</script>

</body>
</html>
